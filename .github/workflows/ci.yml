name: IRONCLAD CI Matrix

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Go Microservices Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test gate-go
        run: cd services/gate-go && go test ./... -race -count=1 -v
      - name: Test topology-go
        run: cd services/topology-go && go test ./... -race -count=1 -v

  test-python:
    name: Python Microservices Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy flask scikit-learn pika pydantic
      - name: Test scoring-python
        run: cd services/scoring-python && PYTHONPATH=. pytest tests/ -v
      - name: Test semantic-python
        run: cd services/semantic-python && PYTHONPATH=. pytest tests/ -v
