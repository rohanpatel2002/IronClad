global:
  environment: production

gate:
  replicaCount: 3
  image:
    repository: ironclad/gate-go
    tag: latest
  service:
    type: ClusterIP
    port: 8080
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

topology:
  replicaCount: 2
  image:
    repository: ironclad/topology-go
    tag: latest
  service:
    type: ClusterIP
    port: 8081

scoring:
  replicaCount: 2
  image:
    repository: ironclad/scoring-python
    tag: latest
  service:
    type: ClusterIP
    port: 8083

semantic:
  replicaCount: 2
  image:
    repository: ironclad/semantic-python
    tag: latest
  service:
    type: ClusterIP
    port: 8082

# Subcharts
postgresql:
  enabled: true
  auth:
    database: ironclad
    username: ironclad
    password: ironclad_dev

redis:
  enabled: true
  architecture: replication # Production-ready replication
  master:
    resources:
      limits:
        memory: 256Mi
