apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: ironclad
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-gate-ingress
  namespace: ironclad
spec:
  selector:
    matchLabels:
      app: gate
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["istio-system", "ingress-nginx"]
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: gate-traffic-mirror
  namespace: ironclad
spec:
  hosts:
  - gate
  http:
  - route:
    - destination:
        host: gate
    mirror:
      host: shadow-gate
    mirrorPercentage:
      value: 10.0
